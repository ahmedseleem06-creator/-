name: Build Titus APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Ensure Android platform scaffolding
        run: |
          if [ ! -d "android" ]; then
            mkdir -p /tmp/titus_backup
            cp -r lib assets pubspec.yaml /tmp/titus_backup/
            flutter create . --project-name titus_app --platforms=android --org com.titus.app
            rm -rf lib assets pubspec.yaml
            cp -r /tmp/titus_backup/* .
          fi

      - name: Grant Internet Permission to Android
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"\/>' "$MANIFEST"
            sed -i '/<application/a \        android:usesCleartextTraffic="true"' "$MANIFEST"
          fi

      - name: Get Dependencies
        run: flutter pub get

      # توليد أيقونة التطبيق لجميع أحجام الشاشات
      - name: Generate App Launcher Icons
        run: flutter pub run flutter_launcher_icons

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Titus-App-Release
          path: build/app/outputs/flutter-apk/app-release.apk
